[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qpsgen"
dynamic = ["version"]
description = "Symbolic quantum phase-space dynamics toolkit for open-system master equations."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [ { name = "Yu Xue-Hao" }, { name = "Qiao Cong-Feng" } ]
keywords = ["Fokker-Planck", "Kramers-Moyal", "Langevin", "Wigner", "positive-P", "phase-space", "quantum", "open-quantum-systems", "Cahill-Glauber"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.10"
dependencies = [
    "sympy>=1.12,<2",
    "numpy>=1.24,<3",
]

[dependency-groups]
test = [
    "pytest",
    "pytest-cov",
    "ruff>=0.14.10",
]
notebook = [
    "ipykernel",
    "nbclient",
    "nbformat",
]

[project.urls]
"Homepage" = "https://github.com/PolarisMegrez/qpsgen"
"Repository" = "https://github.com/PolarisMegrez/qpsgen"
"Issues" = "https://github.com/PolarisMegrez/qpsgen/issues"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "qpsgen.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
