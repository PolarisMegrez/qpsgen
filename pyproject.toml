[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fpgen"
dynamic = ["version"]
description = "Structured Kramers-Moyal / Fokker-Planck / Langevin toolkit (Wigner, P, Q, positive-P)."
readme = "README.md"
license = { text = "MIT" }
authors = [ { name = "Yu Xue-Hao" }, { name = "Qiao Cong-Feng" } ]
keywords = ["Fokker-Planck", "Kramers-Moyal", "Langevin", "Wigner", "positive-P", "phase-space", "quantum", "Cahill-Glauber"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.10"
dependencies = [
    "sympy>=1.12,<2",
    "numpy>=1.24,<3",
]

[dependency-groups]
test = [
    "pytest",
]
notebook = [
    "ipykernel",
    "nbclient",
    "nbformat",
]

[project.urls]
"Homepage" = "https://github.com/PolarisMegrez/fpgen"
"Repository" = "https://github.com/PolarisMegrez/fpgen"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "fpgen.__version__" }
